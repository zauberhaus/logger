version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Security workflow's image (docker/security/Dockerfile).
  - package-ecosystem: docker
    directory: /docker/security
    schedule:
      interval: weekly
