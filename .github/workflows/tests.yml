name: Run Tests
run-name: "Test PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

# No path filter on the trigger: the "test" check is required by the main
# ruleset, so the job has to be reported for every pull request (the
# release-please PR only changes CHANGELOG.md and would otherwise wait for it
# forever). Instead the job always runs and skips its steps, which counts as
# success, when no Go file, go.mod or go.sum changed.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check for Go changes
      id: changes
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if git diff --name-only "$BASE"...HEAD | grep -Eq '(\.go|^go\.mod|^go\.sum)$'; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "go=false" >> "$GITHUB_OUTPUT"
          echo "No Go changes, skipping the tests"
        fi

    - name: Setup go
      if: steps.changes.outputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
        check-latest: true

    - name: Setup gotestfmt
      if: steps.changes.outputs.go == 'true'
      run: |
        go install github.com/boumenot/gocover-cobertura@latest
        go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

    - name: Run Tests
      if: steps.changes.outputs.go == 'true'
      run: |
        ./tests.sh

    - name: Convert go coverage to cobertura format
      if: steps.changes.outputs.go == 'true'
      shell: bash
      run: |
        go run github.com/boumenot/gocover-cobertura@latest \
          -ignore-files '_mock\.go$' < coverage.txt > coverage.xml
        gocover-cobertura \
          -ignore-dirs '^/tools' \
          -ignore-files '_mock\.go$' \
          < coverage.txt > coverage.xml

    - name: Generate code coverage report
      if: steps.changes.outputs.go == 'true'
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        badge: false
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 70'

    - name: Add Coverage PR Comment
      if: steps.changes.outputs.go == 'true'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: test
        recreate: true
        path: code-coverage-results.md